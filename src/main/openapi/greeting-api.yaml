openapi: 3.0.3
info:
  title: Greeting API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: greetings
    description: Create and read greetings
paths:
  /greetings:
    post:
      tags: [greetings]
      operationId: createGreeting
      summary: Create a greeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GreetingRequest'
      responses:
        '200':
          description: The created greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
  /greetings/{id}:
    get:
      tags: [greetings]
      operationId: getGreeting
      summary: Get a greeting by id
      parameters:
        - name: id
          in: path
          required: true
          description: Greeting id
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: Language code, e.g. en or ro
          schema:
            type: string
      responses:
        '200':
          description: The greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    GreetingRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        times:
          type: integer
          default: 1
    Greeting:
      type: object
      required: [id, messages]
      properties:
        id:
          type: string
        messages:
          type: array
          items:
            type: string
