spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN
logging.level.com.example.cli=INFO
# Logs go to a rolling file only; stdout is reserved for command output.
# Override with LOGGING_FILE_NAME=/path/to/file.log
logging.file.name=${user.home}/.cli-demo/cli-demo.log
logging.threshold.console=OFF
